<div class="leftbar-container-wrapper">
  <!-- Mobile backdrop -->
  <div 
    class="backdrop" 
    [class.show]="menuVisible" 
    (click)="closeMenu()"
    aria-hidden="true">
  </div>

  <nav class="leftbar-container" [class.show]="menuVisible" aria-label="Main Navigation">
    <div class="nav-header-mobile">
      <span class="nav-title">Menu</span>
      <button class="close-btn" (click)="closeMenu()" aria-label="Close navigation menu" type="button">&times;</button>
    </div>

    <ul class="nav-list">
      @for (item of navItems; track item.path) {
        <li class="nav-item">
          <a 
            [routerLink]="item.path" 
            routerLinkActive="active" 
            (click)="closeMenu()"
            class="nav-link">
            {{ item.label }}
          </a>
        </li>
      }
    </ul>
  </nav>
</div>
