<header class="header-container">
  <div class="header-left">
    <button class="hamburger-btn" (click)="toggleMenu()" aria-label="Toggle navigation menu" type="button">
      <span class="hamburger-bar"></span>
      <span class="hamburger-bar"></span>
      <span class="hamburger-bar"></span>
    </button>
    
    <a routerLink="/" class="branding-link">
      <img class="headshot" src="/assets/headshot.jpeg" alt="Daniel Remsburg headshot" />
      <div class="branding-text">
        <span class="site-title">Daniel Remsburg</span>
        <span class="site-subtitle">Full-Stack Engineer</span>
      </div>
    </a>
  </div>

  <div class="header-actions">
    <button 
      class="theme-toggle-btn" 
      (click)="toggleTheme()" 
      [title]="'Switch to ' + (themeService.currentTheme() === 'dark' ? 'Light' : 'Dark') + ' Mode'"
      aria-label="Toggle color theme"
      type="button">
      @if (themeService.currentTheme() === 'dark') {
        <span class="theme-icon light-icon" aria-hidden="true">&#9788;</span>
        <span class="theme-label">Light</span>
      } @else {
        <span class="theme-icon dark-icon" aria-hidden="true">&#9790;</span>
        <span class="theme-label">Dark</span>
      }
    </button>
  </div>
</header>
